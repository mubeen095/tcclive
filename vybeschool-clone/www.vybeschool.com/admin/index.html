<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | The Coding Company</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://thecodingcompany.com/admin" />
    <meta name="theme-color" content="#050505" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700;800&family=DM+Mono:wght@300;400;500&display=swap" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #050505; }
      body { color: #fff; font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; }
      button, a { font-family: inherit; }
      a { color: inherit; text-decoration: none; }
      .serif { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.02em; }
      .mono { font-family: 'DM Mono', monospace; }

      header { padding: 16px 22px; display: flex; align-items: center; justify-content: space-between; }
      .brand { font-family: 'Instrument Serif', serif; font-weight: 700; letter-spacing: -0.01em; font-size: 23px; color: rgba(255,255,255,0.9); }
      .eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(255,255,255,0.4); }

      .wrap { max-width: 1080px; margin: 32px auto 80px; padding: 0 22px; }
      .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
      .head h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 800; letter-spacing: -0.04em; }
      .tabs { display: flex; gap: 10px; }
      .tab { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); border-radius: 999px; padding: 9px 18px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.25s; }
      .tab.active { background: #fff; color: #050505; border-color: #fff; }

      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px; }
      .stat { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 18px; }
      .stat .v { font-family: 'Instrument Serif', serif; font-size: 30px; }
      .stat .l { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-top: 4px; }

      .row { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; }
      .row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .row-type { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4D8DFF; font-weight: 700; }
      .row-time { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.3); }
      .row-email { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); margin-top: 6px; }
      .row-payload { font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 6px; word-break: break-word; white-space: pre-wrap; }
      .empty { text-align: center; color: rgba(255,255,255,0.35); font-size: 14px; padding: 60px 0; }

      .req-box { max-width: 440px; margin: 120px auto; text-align: center; }
      .req-box h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
      .req-box p { color: rgba(255,255,255,0.45); margin: 12px 0 24px; font-size: 14px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 13px 26px; font-size: 13px; font-weight: 700; border: 0; cursor: pointer; transition: all 0.25s; }
      .btn-primary { background: #0057DE; color: #fff; }
      .btn-primary:hover { background: #0A63EA; }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="brand">thecodingcompany</a>
      <span class="eyebrow">Admin</span>
    </header>
    <main class="wrap" id="view"></main>

    <script>
      var view = document.getElementById('view');
      var scope = 'submissions';

      fetch('/api/me', { credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (me) {
          if (!me.member) { renderReq(); return; }
          if (me.member.role !== 'admin') { renderReq(); return; }
          load();
        }).catch(renderReq);

      function renderReq() {
        view.innerHTML =
          '<div class="req-box"><h1>Admins only.</h1>' +
          '<p>Sign in with an admin account to view members and form submissions.</p>' +
          '<a class="btn btn-primary" href="/login">Sign In</a></div>';
      }

      function load() {
        renderTabs();
        fetch('/api/admin?scope=' + scope, { credentials: 'include' })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (scope === 'members') renderMembers(data.members || []);
            else renderSubs(data.submissions || []);
          })
          .catch(function () { view.innerHTML += '<div class="empty">Failed to load.</div>'; });
      }

      function renderTabs() {
        var tabs = '<div class="head"><h1>Admin Panel</h1>' +
          '<div class="tabs">' +
            '<button class="tab ' + (scope==='submissions'?'active':'') + '" data-s="submissions">Submissions</button>' +
            '<button class="tab ' + (scope==='members'?'active':'') + '" data-s="members">Members</button>' +
          '</div></div>' +
          '<div class="stats" id="stats"></div><div id="rows"></div>';
        view.innerHTML = tabs;
        view.querySelectorAll('.tab').forEach(function (b) {
          b.addEventListener('click', function () { scope = b.dataset.s; load(); });
        });
      }

      function renderSubs(list) {
        var byType = {};
        list.forEach(function (s) { byType[s.form_type] = (byType[s.form_type] || 0) + 1; });
        var stats = '<div class="stat"><div class="v">' + list.length + '</div><div class="l">Total</div></div>' +
          Object.keys(byType).map(function (k) { return '<div class="stat"><div class="v">' + byType[k] + '</div><div class="l">' + k + '</div></div>'; }).join('');
        document.getElementById('stats').innerHTML = stats;
        document.getElementById('rows').innerHTML = list.length
          ? list.map(function (s) {
              return '<div class="row"><div class="row-head"><span class="row-type">' + s.form_type +
                '</span><span class="row-time">' + new Date(s.created_at).toLocaleString() + '</span></div>' +
                '<div class="row-email">' + (s.email || '—') + '</div>' +
                '<div class="row-payload">' + escapeHtml(JSON.stringify(s.payload, null, 2)) + '</div></div>';
            }).join('')
          : '<div class="empty">No submissions yet.</div>';
      }

      function renderMembers(list) {
        document.getElementById('stats').innerHTML = '<div class="stat"><div class="v">' + list.length + '</div><div class="l">Members</div></div>';
        document.getElementById('rows').innerHTML = list.length
          ? list.map(function (m) {
              return '<div class="row"><div class="row-head"><span class="row-type">' + m.role +
                '</span><span class="row-time">' + new Date(m.created_at).toLocaleString() + '</span></div>' +
                '<div class="row-email">' + m.name + ' · ' + m.email + '</div></div>';
            }).join('')
          : '<div class="empty">No members yet.</div>';
      }

      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
    </script>
  </body>
</html>
